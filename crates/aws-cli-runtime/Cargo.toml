[package]
name = "aws-cli-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aws-cli-model = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
# `default-features = false` matters: ureq's default `gzip` feature transparently
# decodes a gzip-encoded response, but the CLI must write the object's stored bytes
# unchanged -- `s3api get-object` on a gzip-encoded object has to produce the gzip.
# It also made an empty gzip body fail as "unexpected end of file".
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
hyper-rustls = { workspace = true }
rustls = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
serde = { workspace = true, features = ["derive"] }
sha1 = "0.10"

[dev-dependencies]
serde_json.workspace = true
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
# Only for the local UTC offset: `s3 ls` prints local timestamps and std has no tz data.
libc = "0.2"
