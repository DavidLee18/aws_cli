[package]
name = "awsc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "awsc"
path = "src/main.rs"

[dependencies]
aws-cli-model = { workspace = true }
aws-cli-protocol = { workspace = true }
aws-cli-runtime = { workspace = true }
aws-cli-output = { workspace = true }
serde_json = { workspace = true }
regex = "1"
# Only for SSE-C: S3 requires the customer key's MD5 alongside the key itself.
md-5 = "0.10"
base64ct = { version = "1", features = ["alloc"] }
quick-xml = { workspace = true }
serde = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Terminal width for the transfer progress line.
libc = "0.2"
