[package]
name = "awsc-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Smithy model loading for a Rust port of the AWS CLI: a mmap-backed container over the compiled service catalogue."
repository = "https://github.com/DavidLee18/aws_cli"
homepage = "https://github.com/DavidLee18/aws_cli"
keywords = ["aws", "smithy", "cli", "models"]
categories = ["command-line-utilities"]

[dependencies]
memmap2 = "0.9"
elsa = "1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = "1"
indexmap = { version = "2.14.0", features = ["serde"] }
