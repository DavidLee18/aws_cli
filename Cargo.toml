[workspace]
resolver = "2"
# Crates are added as they are implemented. The full planned layout is in README.md:
# awsc (binary), model, args, protocol, runtime, output, custom.
members = [
    "crates/awsc-model",
    "crates/awsc-protocol",
    "crates/awsc-runtime",
    "crates/awsc-output",
    "crates/awsc-conformance",
    "crates/awsc",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
awsc-model = { path = "crates/awsc-model", version = "0.3.0" }
awsc-protocol = { path = "crates/awsc-protocol", version = "0.3.0" }
awsc-runtime = { path = "crates/awsc-runtime", version = "0.3.0" }
awsc-output = { path = "crates/awsc-output", version = "0.3.0" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
quick-xml = "0.37"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "native-tokio", "tls12", "aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
rustls-pemfile = "2"
bytes = "1"
http = "1"
tracing = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
